<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invoice Generator by Essi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Anton&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #171717; --paper: #ececec; --paper-panel: #ffffff; --line: #e6e6e6;
    --accent: #111111; --danger: #a4432f; --preview-ink:#161616; --preview-accent:#d9602f;
    font-family: 'Space Mono', monospace;
  }
  :root[data-theme="night"] {
    --ink:#f5f5f5; --paper:#1b1b1b; --paper-panel:#101010; --line:#303030; --accent:#ffffff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; background:var(--paper); color:var(--ink); padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  .topbar { position:fixed; inset:0 auto auto 0; width:360px; height:64px; z-index:5; background:var(--paper-panel); border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:22px 28px 0; }
  h1 { font-family:'Space Mono',monospace; font-weight:700; font-size:18px; margin:0; letter-spacing:0; }
  .subhead { display:none; }
  .theme-toggle { position:fixed; top:16px; right:18px; z-index:8; display:flex; align-items:center; gap:8px; background:var(--paper-panel); color:var(--ink); border:1px solid var(--line); border-radius:999px; padding:7px 10px; font-family:inherit; font-size:12px; cursor:pointer; box-shadow:0 2px 12px rgba(0,0,0,0.08); }
  .theme-toggle span:first-child { width:22px; height:22px; border-radius:50%; display:grid; place-items:center; background:var(--ink); color:var(--paper-panel); line-height:1; }
  .split { height:100vh; padding:64px 0 0; display:grid; grid-template-columns:360px minmax(0,1fr); gap:0; align-items:start; overflow:hidden; }
  @media (max-width:900px) { .topbar { position:static; width:auto; height:auto; padding:22px 20px; border-right:0; } .split { grid-template-columns:1fr; padding:0; } }

  .sheet { position:fixed; left:0; top:64px; bottom:0; width:360px; background:var(--paper-panel); border:0; border-right:1px solid var(--line); border-radius:0; padding:18px 28px 28px; overflow:auto; }
  .field { display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .field label { font-size:12px; text-transform:none; letter-spacing:0; opacity:1; color:var(--ink); font-weight:700; }
  input, textarea, select { font-family:inherit; font-size:12px; background:color-mix(in srgb, var(--paper-panel) 94%, var(--ink) 6%); border:1px solid var(--line); border-radius:8px; padding:11px 12px; color:var(--ink); width:100%; box-shadow:inset 0 0 0 1px rgba(0,0,0,0.01); }
  input:focus, textarea:focus, select:focus { outline:2px solid var(--accent); outline-offset:1px; background:var(--paper-panel); }
  .block-title { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.14em; margin:26px 0 14px; border-bottom:0; padding-bottom:0; opacity:1; color:var(--ink); }
  .block-title:first-child { margin-top:0; }
  textarea { min-height:62px; resize:vertical; }
  .item-row { border:0; border-radius:0; padding:0; margin-bottom:8px; background:transparent; }
  .item-row input.desc-input { margin-bottom:8px; }
  .qty-rate { display:grid; grid-template-columns:1fr 1fr auto; gap:6px; align-items:center; }
  .qty-rate span { font-size:12px; opacity:0.6; white-space:nowrap; }
  .rm-btn { background:none; border:none; color:var(--danger); cursor:pointer; font-size:18px; padding:2px 6px; line-height:1; }
  .saved-tools { display:grid; grid-template-columns:1fr; gap:8px; align-items:end; margin-bottom:12px; }
  .saved-tools .field { margin-bottom:0; }
  .add-row { background:var(--paper-panel); border:1px dashed var(--line); color:var(--ink); border-radius:8px; padding:11px 14px; cursor:pointer; font-size:12px; opacity:0.75; width:100%; font-family:inherit; }
  .add-row:hover { opacity:1; border-color:var(--accent); }
  .save-status { font-size:12px; opacity:0.6; margin:-4px 0 10px; min-height:14px; }
  .actions { position:sticky; bottom:-28px; background:var(--paper-panel); border-top:1px solid var(--line); margin:26px -28px -28px; padding:18px 28px 28px; }
  button.primary { background:var(--ink); color:var(--paper-panel); border:none; border-radius:8px; padding:16px 20px; font-size:12px; cursor:pointer; font-family:inherit; font-weight:700; width:100%; }
  button.secondary { background:var(--paper-panel); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:11px 14px; font-size:12px; cursor:pointer; font-family:inherit; }

  .preview-pane { position:fixed; left:360px; right:0; top:64px; bottom:0; background:#ececec; padding:34px 44px; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden; }
  .preview-label { display:none; }
  .page-scaler { position:relative; }
  .page-native { width:8.5in; height:11in; background:#fff; position:relative; overflow:hidden; box-shadow:0 2px 18px rgba(0,0,0,0.10); transform-origin:top left; }
  .page-content { position:absolute; inset:0; padding:1.15in 0.75in 0.85in; box-sizing:border-box; font-family:var(--preview-font, 'Space Mono', monospace); color:var(--preview-ink); font-size:12px; transform-origin:top left; display:flex; flex-direction:column; }
  .p-head { display:flex; justify-content:space-between; gap:16px; margin-bottom:16px; }
  .p-label { font-size:12px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; }
  .p-accent { color:var(--preview-accent); }
  .p-bold { font-weight:700; font-size:12px; margin-top:4px; }
  .p-party-label { font-size:18px; }
  .p-party-name { font-size:18px; }
  .p-addr { font-size:12px; line-height:1.5; white-space:pre-line; margin-top:2px; }
  .p-meta { text-align:right; font-size:12px; }
  .p-meta .p-val { margin-bottom:8px; }
  .p-logo { max-width:110px; max-height:54px; object-fit:contain; display:block; margin:0 0 12px auto; }
  .dash { border-bottom:1.5px dashed #999; margin:10px 0; }
  .p-table-head { display:grid; grid-template-columns:1fr 70px 50px 80px; font-size:12px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; padding-bottom:8px; }
  .p-table-head span:not(:first-child), .p-item span:not(:first-child) { text-align:right; }
  .p-item { display:grid; grid-template-columns:1fr 70px 50px 80px; font-size:12px; padding:8px 0; border-bottom:1px dashed #ccc; }
  .p-sum-row { display:flex; justify-content:space-between; font-size:12px; font-weight:700; padding:8px 0; border-bottom:1px dashed #ccc; }
  .p-total-row { display:flex; justify-content:space-between; font-size:18px; font-weight:700; padding:10px 0; color:var(--preview-accent); }
  .p-note { font-size:12px; line-height:1.5; margin:10px 0 18px; white-space:pre-line; }
  .p-note-label { font-weight:700; letter-spacing:0.05em; text-transform:uppercase; }
  .p-bottom-cols { display:flex; justify-content:space-between; gap:24px; }
  .p-from, .p-payment { font-size:12px; line-height:1.9; }
  .p-wordmark { font-family:var(--preview-font, 'Space Mono', monospace); font-weight:700; color:var(--preview-accent); font-size:88px; letter-spacing:0.01em; text-align:left; margin-top:28px; }
  .p-footer { font-size:12px; text-align:center; display:flex; justify-content:center; gap:18px; flex-wrap:wrap; opacity:0.85; margin-top:16px; }

  .page-content.style-modern .dash { border-bottom:1px solid var(--preview-ink); opacity:0.35; }
  .page-content.style-modern .p-table-head { background:var(--preview-accent); color:#fff; padding:8px 10px; }
  .page-content.style-modern .p-item { border-bottom:1px solid rgba(0,0,0,0.16); padding:10px; }
  .page-content.style-modern .p-total-row { background:var(--preview-accent); color:#fff; padding:12px 14px; margin-top:8px; }
  .page-content.style-modern .p-wordmark { text-align:left; font-size:76px; }

  .page-content.style-editorial { background:#fbf3e7; padding-top:0.95in; }
  .page-content.style-editorial .p-head { border-top:6px solid var(--preview-accent); padding-top:18px; }
  .page-content.style-editorial .dash { border-bottom:1px solid var(--preview-accent); opacity:0.55; }
  .page-content.style-editorial .p-table-head { letter-spacing:0.12em; border-bottom:2px solid var(--preview-ink); }
  .page-content.style-editorial .p-item { border-bottom:1px solid rgba(0,0,0,0.18); padding:12px 0; }
  .page-content.style-editorial .p-total-row { font-size:22px; border-bottom:3px solid var(--preview-accent); }
  .page-content.style-editorial .p-wordmark { font-size:96px; letter-spacing:0.04em; opacity:0.92; }

  .page-content.style-minimal { padding:0.78in 0.68in 0.72in; background:#fff; }
  .page-content.style-minimal .minimal-top { display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start; margin-bottom:0.78in; }
  .page-content.style-minimal .minimal-brand { font-size:30px; line-height:1.1; font-weight:700; margin-bottom:12px; }
  .page-content.style-minimal .minimal-contact, .page-content.style-minimal .minimal-muted { color:#8d8d8d; line-height:1.55; white-space:pre-line; }
  .page-content.style-minimal .minimal-invoice, .page-content.style-minimal .minimal-date { text-align:right; }
  .page-content.style-minimal .minimal-title { font-size:34px; line-height:1; font-weight:700; letter-spacing:0.01em; text-transform:uppercase; }
  .page-content.style-minimal .minimal-number { color:#8d8d8d; margin-top:8px; }
  .page-content.style-minimal .minimal-mid { display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-bottom:0.72in; }
  .page-content.style-minimal .p-label { color:var(--preview-ink); font-size:12px; letter-spacing:0.18em; }
  .page-content.style-minimal .p-party-name { font-size:17px; margin:14px 0 8px; }
  .page-content.style-minimal .p-table-head { grid-template-columns:1fr 80px 90px 100px; border-bottom:2px solid var(--preview-ink); padding-bottom:12px; letter-spacing:0.08em; }
  .page-content.style-minimal .p-item { grid-template-columns:1fr 80px 90px 100px; border-bottom:1px solid #ececec; padding:18px 0; font-size:15px; }
  .page-content.style-minimal .p-item span:nth-child(2) { color:#888; }
  .page-content.style-minimal .minimal-summary { width:3.25in; margin:0.36in 0 0 auto; }
  .page-content.style-minimal .p-sum-row { color:#888; border-bottom:1px solid #ececec; padding:10px 0; font-weight:400; }
  .page-content.style-minimal .p-total-row { color:var(--preview-ink); font-size:26px; padding:16px 0 0; }
  .page-content.style-minimal .p-total-row span:first-child { font-size:18px; align-self:center; }
  .page-content.style-minimal .minimal-bottom-rule { border-bottom:1px solid #ececec; margin-bottom:0.35in; }
  .page-content.style-minimal .p-payment { max-width:4.2in; line-height:1.9; }
  .page-content.style-minimal .minimal-pay-row { display:grid; grid-template-columns:1.25in 1fr; gap:10px; }
  .page-content.style-minimal .minimal-pay-row span:first-child { color:#888; }
  .page-content.style-minimal .p-note { color:#666; margin:18px 0 0; }
  .page-content.style-minimal .p-logo { margin:0 0 16px auto; max-width:96px; max-height:48px; }

  @media (max-width:900px) {
    .split { height:auto; overflow:visible; }
    .sheet { position:static; width:auto; height:auto; overflow:visible; border-right:0; border-bottom:1px solid var(--line); }
    .preview-pane { position:static; min-height:0; padding:24px 12px; }
    .actions { bottom:0; }
  }

  @media print {
    body { background:#fff; padding:0; }
    .no-print { display:none !important; }
    .topbar, .split { max-width:none; padding:0; display:block; }
    .page-scaler { transform:none !important; }
    .page-native { box-shadow:none; }
    @page { size:Letter; margin:0; }
  }
</style>
</head>
<body>
<button class="theme-toggle no-print" type="button" onclick="toggleTheme()" aria-label="Switch day and night mode">
  <span id="themeIcon">☀</span><strong id="themeLabel">Day</strong>
</button>
<div class="topbar no-print">
  <h1>Invoice Generator by Essi</h1>
  <p class="subhead">Type on the left, watch the Letter invoice update on the right.</p>
</div>

<div class="split">
  <div class="sheet no-print">
    <p class="block-title" style="margin-top:0;">Bill from</p>
    <div class="saved-tools">
      <div class="field"><label>Saved businesses</label><select id="businessSelect" onchange="selectBusiness()"><option value="">Choose business</option></select></div>
      <button class="secondary" type="button" onclick="addBusiness()">Add business</button>
    </div>
    <div class="save-status" id="businessStatus"></div>
    <div class="field"><label>Your business name</label><input id="fromName" placeholder="Business name" oninput="renderPreview()"></div>
    <div class="field"><label>Your address</label><textarea id="fromDetails" placeholder="Business address" oninput="renderPreview()"></textarea></div>
    <div class="field"><label>Your email</label><input id="fromEmail" placeholder="business@email.com" oninput="renderPreview()"></div>

    <p class="block-title">Bill to</p>
    <div class="saved-tools">
      <div class="field"><label>Saved clients</label><select id="clientSelect" onchange="selectClient()"><option value="">Choose client</option></select></div>
      <button class="secondary" type="button" onclick="addClient()">Add client</button>
    </div>
    <div class="save-status" id="clientStatus"></div>
    <div class="field"><label>Client name</label><input id="toName" placeholder="Client name" oninput="renderPreview()"></div>
    <div class="field"><label>Client address</label><textarea id="toDetails" placeholder="123 Anywhere St., Any City, ST 12345" oninput="renderPreview()"></textarea></div>
    <div class="field"><label>Client email</label><input id="toEmail" placeholder="client@email.com" oninput="renderPreview()"></div>

    <p class="block-title">Invoice details</p>
    <div class="row2">
      <div class="field"><label>Invoice no.</label><input id="invNumber" value="INV000" oninput="renderPreview()"></div>
      <div class="field"><label>Currency</label>
        <select id="currency" onchange="renderPreview()">
          <option value="₱">PHP ₱</option><option value="$" selected>USD $</option><option value="€">EUR €</option><option value="£">GBP £</option>
        </select>
      </div>
      <div class="field"><label>Date issued</label><input id="invDate" type="date" oninput="renderPreview()"></div>
    </div>
    <div class="field"><label>Discount (optional)</label><input id="discount" type="number" value="0" min="0" oninput="renderPreview()"></div>
    <div class="field"><label>Note (optional)</label><textarea id="invoiceNote" placeholder="Please pay within 5 days of receiving this invoice." oninput="renderPreview()"></textarea></div>
    <p class="block-title">Items</p>
    <div id="itemsBody"></div>
    <button class="add-row" onclick="addRow()">+ Add item</button>

    <p class="block-title">Payment details</p>
    <div class="saved-tools">
      <div class="field"><label>Saved bank accounts</label><select id="bankSelect" onchange="selectBank()"><option value="">Choose bank account</option></select></div>
      <button class="secondary" type="button" onclick="addBank()">Add bank</button>
    </div>
    <div class="save-status" id="bankStatus"></div>
    <div class="field"><label>Bank name</label><input id="bankName" placeholder="Bank of Arrowai" oninput="renderPreview()"></div>
    <div class="field"><label>Account number</label><input id="bankAccount" placeholder="123-456-7890" oninput="renderPreview()"></div>
    <div class="field"><label>Account name</label><input id="bankAccountName" placeholder="Arrowai Contractor" oninput="renderPreview()"></div>
    <div class="field"><label>Home address</label><input id="bankHomeAddress" placeholder="123 Anywhere St., Any City" oninput="renderPreview()"></div>
    <div class="field"><label>SWIFT address</label><input id="bankSwift" placeholder="ABCDEF12" oninput="renderPreview()"></div>
    <div class="field"><label>Bank code</label><input id="bankCode" placeholder="001" oninput="renderPreview()"></div>

    <p class="block-title">Footer contact</p>
    <div class="field"><label>Phone</label><input id="phone" placeholder="+123-456-7890" oninput="renderPreview()"></div>
    <div class="field"><label>Website</label><input id="website" placeholder="reallygreatsite.com" oninput="renderPreview()"></div>
    <div class="field"><label>Address</label><input id="address" placeholder="123 Anywhere St., Any City" oninput="renderPreview()"></div>

    <p class="block-title">Style</p>
    <div class="field"><label>Logo (optional)</label><input id="logoInput" type="file" accept="image/*" onchange="loadLogo(event)"></div>
    <button class="secondary" type="button" onclick="removeLogo()">Remove logo</button>
    <div class="field"><label>Invoice style</label>
      <select id="invoiceStyle" onchange="renderPreview()">
        <option value="classic" selected>Classic</option>
        <option value="modern">Modern</option>
        <option value="editorial">Editorial</option>
        <option value="minimal">Minimal</option>
      </select>
    </div>
    <div class="field"><label>Invoice font</label>
      <select id="invoiceFont" onchange="renderPreview()">
        <option value="'Space Mono', monospace" selected>Space Mono</option>
        <option value="'Inter', sans-serif">Inter</option>
        <option value="'Anton', sans-serif">Anton</option>
        <option value="Georgia, serif">Georgia</option>
        <option value="Arial, sans-serif">Arial</option>
      </select>
    </div>
    <div class="row2">
      <div class="field"><label>Font color</label><input id="fontColor" type="color" value="#161616" oninput="renderPreview()"></div>
      <div class="field"><label>Highlight color</label><input id="highlightColor" type="color" value="#d9602f" oninput="renderPreview()"></div>
    </div>

    <div class="actions">
      <button class="primary" onclick="window.print()">Download PDF</button>
    </div>
  </div>

  <div class="preview-pane">
    <p class="preview-label no-print">Live preview — Letter, one page</p>
    <div class="page-scaler" id="pageScaler">
      <div class="page-native" id="pageNative">
        <div class="page-content" id="pageContent"></div>
      </div>
    </div>
  </div>
</div>

<script>
let rowId = 0;
let selectedBusinessName = '';
let selectedClientName = '';
let selectedBankKey = '';
let logoDataUrl = '';

function addRow(desc = '', qty = 1, rate = 0) {
  const container = document.getElementById('itemsBody');
  const id = 'row' + (rowId++);
  const div = document.createElement('div');
  div.className = 'item-row';
  div.id = id;
  div.innerHTML = `
    <input type="text" class="desc-input" value="${desc}" placeholder="Description of work" oninput="renderPreview()">
    <div class="qty-rate">
      <div><span>Price</span> <input type="number" class="rate-input" value="${rate}" min="0" step="0.01" oninput="renderPreview()"></div>
      <div><span>Qty</span> <input type="number" class="qty-input" value="${qty}" min="0" step="1" oninput="renderPreview()"></div>
      <button class="rm-btn no-print" onclick="document.getElementById('${id}').remove(); renderPreview();">×</button>
    </div>`;
  container.appendChild(div);
  renderPreview();
}

function loadLogo(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    logoDataUrl = reader.result;
    renderPreview();
  };
  reader.readAsDataURL(file);
}

function removeLogo() {
  logoDataUrl = '';
  document.getElementById('logoInput').value = '';
  renderPreview();
}

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  document.getElementById('themeIcon').textContent = theme === 'night' ? '☾' : '☀';
  document.getElementById('themeLabel').textContent = theme === 'night' ? 'Night' : 'Day';
  localStorage.setItem('invoiceTheme', theme);
}

function toggleTheme() {
  const current = document.documentElement.dataset.theme === 'night' ? 'night' : 'day';
  applyTheme(current === 'night' ? 'day' : 'night');
}

function esc(str) { return (str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtMoney(cur, n) { return cur + n.toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:0}); }
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${mm}/${dd}/${d.getFullYear()}`;
}

function getBusinesses() {
  try { return JSON.parse(localStorage.getItem('invoiceBusinesses') || '[]'); } catch (e) { return []; }
}
